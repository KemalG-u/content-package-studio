# CI: run the tests on every push and pull request.
# Least privilege: top-level read-only token; third-party actions pinned to full commit SHAs (version in the comment).
# Windows only: the suite has been run on Windows; Linux/macOS are untested.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install the X text counter (twitter-text, pinned in package-lock.json)
        run: npm ci
        working-directory: studio
      - name: Install ffmpeg (the media, upload and video tests are skipped without it)
        shell: bash
        run: |
          choco install ffmpeg --yes --no-progress
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Python tests
        # The only tests allowed to be skipped are the three opt-in live ones
        # (STUDIO_LIVE_MODEL, STUDIO_LIVE_AUDIO, STUDIO_LIVE_ASR). Any other skip,
        # for example a missing ffmpeg, fails the job instead of passing silently.
        shell: bash
        run: |
          python -X utf8 -m unittest discover -s studio -t . -p "test_*.py" 2>&1 | tee unittest.log
          grep -qx 'OK (skipped=3)' unittest.log
      - name: Front-end flow test
        run: node --test studio/test_frontend_flows.js
